version: "3.9"

services:
  web:
    build: .
    command: ['./wait-for-postgres.sh', 'postgres', 'gunicorn', 'tidestom.wsgi:application', '--bind', '0.0.0.0:8000']
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - snid_api
      - ngsf_api
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - snid_api_runs:/snid_api_runs
      - ngsf_api_runs:/ngsf_api_runs
    environment:
      LOCAL_MODE: 'True'
      TIDES_TEST_DIR: 'test_data/'
      DB_PASS: ${DB_PASS}
      # Remote PostgreSQL database connection
      DATABASE_URL: postgresql://tides:@postgres:5432/tides_db

      # Django settings
      DJANGO_SECRET_KEY: "u-a)en=plsciz3d4(2*yc()4(1=#@o)bkdusqho3kx%)i&amp;0cy"
      DJANGO_SETTINGS_MODULE: tidestom.settings
      SNID_API_URL: http://snid_api:8000
      NGSF_API_URL: http://ngsf_api:8000

  nginx:
    image: nginx:1.25
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
      - media_volume:/media
      - snid_api_runs:/snid_api_runs
      - ngsf_api_runs:/ngsf_api_runs
    ports:
      - "8080:80"
    depends_on:
      - web
      - snid_api
      - ngsf_api

  snid_api:
    build: ./snid_docker/
    #container_name: snid_api
    expose:
      - "8000"
    environment:
      DJANGO_URL: http://web:8000
    volumes:
      - snid_api_runs:/snid_api_runs

  ngsf_api:
    build: ./ngsf_docker/
    expose:
      - "8000"
    environment:
      DJANGO_URL: http://web:8000
    volumes:
      - ngsf_api_runs:/ngsf_api_runs

  postgres:
    image: postgres:15-alpine
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: tides 
      POSTGRES_DB: tides_db
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  static_volume:
  media_volume:
  snid_api_runs:
  ngsf_api_runs:
  db_data:
