version: "3.9"

services:
  web:
    build: .
    command: gunicorn tidestom.wsgi:application --bind 0.0.0.0:8000
    expose:
      - "8000"
    depends_on:
      - snid_api 
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - snid_api_runs:/snid_api_runs
    environment:
      TIDES_TEST_DIR: ${TIDES_TEST_DIR}
      DB_PASS: ${DB_PASS}
      DATABASE_URL: postgres://cf5g09:titanic2018@cannon.phys.soton.ac.uk/tidestom
      DJANGO_SECRET_KEY: "u-a)en=plsciz3d4(2*yc()4(1=#@o)bkdusqho3kx%)i&amp;0cy"
      DJANGO_SETTINGS_MODULE: tidestom.settings
      SNID_API_URL: http://snid_api:8000

  nginx:
    image: nginx:1.25
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
      - media_volume:/media
      - snid_api_runs:/snid_api_runs
    ports:
      - "8080:80"
    depends_on:
      - web
      - snid_api

  snid_api:
    build: ./snid_docker/
    #container_name: snid_api
    expose:
      - "8000"
    volumes:
      - snid_api_runs:/snid_api_runs 

volumes:
  static_volume:
  media_volume:
  snid_api_runs:
