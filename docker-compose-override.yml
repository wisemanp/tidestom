version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tides
      POSTGRES_PASSWORD: tides
      POSTGRES_DB: tides_db
    ports:
      - "5432:5432"

web:
  environment:
    DB_USER: tides
    DB_PASS: tides
    DB_HOST: tides
    DB_PORT: 5432
    DATABASE_URL: postgres://tides:tides@postgres:5432/tides_db
  depends_on:
    - postgres
