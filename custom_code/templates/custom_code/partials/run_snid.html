<div class="card">
    <div class="card-header">
       Run SNID
    </div>
    <div class="card-body">
			<form id="snid-form" class='ajax-form' data-result-id='snid-result' method="post" action="{% url 'snid-run' %}">
			{% csrf_token %}
			<!-- Wavelength Inputs -->
			<div class="form-row">
			<div class="form-group col-md-6">
			<label for="wmin">Wavelength Min:</label>
			<input type="number" name="wmin" step="0.1" required value="4000" class="form-control">
			</div>
			<div class="form-group col-md-6">
			<label for="wmax">Wavelength Max:</label>
			<input type="number" name="wmax" step="1" required value="9000" class="form-control">
			</div>
			</div>
			
			<!-- Z Inputs -->
			<div class="form-row">
			<div class="form-group col-md-6">
			<label for="zmin">z Min:</label>
			<input type="number" name="zmin" step="0.001" required value="0.1" class="form-control">
			</div>
			<div class="form-group col-md-6">
			<label for="zmax">z Max:</label>
			<input type="number" name="zmax" step="0.001" required value="1.2" class="form-control">
			</div>
			</div>
			
			<!-- Emission Clip Inputs -->
			<div class="form-row">
			<div class="form-group col-md-6">
			<label for="emclip">Clip Emission at Redshift:</label>
			<input type="number" name="emclip" step="0.001" class="form-control">
			</div>
			<div class="form-group col-md-6">
			<label for="emwid">Clip Emission Width (&angst;):</label>
			<input type="number" name="emwid" step="1" required value="40" class="form-control">
			</div>
			</div>
			
			<!-- Age Inputs Inputs -->
			<div class="form-row">
			<div class="form-group col-md-6">
			<label for="agemin">Minimum Age:</label>
			<input type="number" name="agemin" step="1" value=-90 class="form-control">
			</div>
			<div class="form-group col-md-6">
			<label for="agemax">Maximum age:</label>
			<input type="number" name="agemax" step="1" value=1000 class="form-control">
			</div>
			</div>
			
			<div class="form-row">
			<div class='form-group col-md-6 text-center'>
			<label for="use" class="d-block"> Use these types:</label>
			<select id='use' name='use' multiple='multiple'>
				<option value='type1'>type1</option>
				<option value='type2'>type2</option>
				<option value='type3'>type3</option>
				<option value='type4'>type4</option>
				<option value='type5'>type5</option>
			</select>
			</div>
			
			<div class='form-group col-md-6 text-center'>
			<label for="usesub" class="d-block"> Use these subtypes:</label>
			<select id='usesub' name='usesub' multiple='multiple'>
				<option value='type1'>type1</option>
				<option value='type2'>type2</option>
				<option value='type3'>type3</option>
				<option value='type4'>type4</option>
				<option value='type5'>type5</option>
			</select>
			</div>
			</div>
						
			<div class="form-row">
			<div class='form-group col-md-6 text-center'>
			<label for="avoid" class="d-block"> Avoid these types:</label>
			<select id='avoid' name='avoid' multiple='multiple'>
				<option value='type1'>type1</option>
				<option value='type2'>type2</option>
				<option value='type3'>type3</option>
				<option value='type4'>type4</option>
				<option value='type5'>type5</option>
			</select>
			</div>
			
			<div class='form-group col-md-6 text-center'>
			<label for="avoidsub" class="d-block"> Avoid these subtypes:</label>
			<select id='avoidsub' name='avoidsub' multiple='multiple'>
				<option value='type1'>type1</option>
				<option value='type2'>type2</option>
				<option value='type3'>type3</option>
				<option value='type4'>type4</option>
				<option value='type5'>type5</option>
			</select>
			</div>
			</div>
			<div class="form-group mt-3">
  				<label for="aband" class="form-check-label">
    				Tellurics:
    				<input class="form-check-input ml-2" type="checkbox" value="" id="aband" name='aband'>
  				</label>
			</div>
			<div class="form-group mt-3">
				<button type="submit" class="btn btn-primary btn-block">Run SNID</button>
			</div>
			</div>
		</form>
	</div>
	<div id="snid-result" class="mt-3"></div>
</div>

<script>
  $(document).ready(function() {
    $('#use').multiselect({
      includeSelectAllOption: true,
      enableFiltering: true,
      enableCaseInsensitiveFiltering: true,
      buttonWidth: '100%',
      nonSelectedText: 'Select options',
      maxHeight: 200
    });
  $('#use').multiselect('selectAll', false);  // false means don’t trigger onChange
  $('#use').multiselect('updateButtonText');  // refresh the button text
  });
</script>


<script>
  $(document).ready(function() {
    $('#usesub').multiselect({
      includeSelectAllOption: true,
      enableFiltering: true,
      enableCaseInsensitiveFiltering: true,
      buttonWidth: '100%',
      nonSelectedText: 'Select options',
      maxHeight: 200
    });
  $('#usesub').multiselect('selectAll', false);  // false means don’t trigger onChange
  $('#usesub').multiselect('updateButtonText');  // refresh the button text
  });
</script>

<script>
  $(document).ready(function() {
    $('#avoid').multiselect({
      includeSelectAllOption: true,
      enableFiltering: true,
      enableCaseInsensitiveFiltering: true,
      buttonWidth: '100%',
      nonSelectedText: 'Select options',
      maxHeight: 200
    });
  });
</script>


<script>
  $(document).ready(function() {
    $('#avoidsub').multiselect({
      includeSelectAllOption: true,
      enableFiltering: true,
      enableCaseInsensitiveFiltering: true,
      buttonWidth: '100%',
      nonSelectedText: 'Select options',
      maxHeight: 200
    });
  });
</script>
