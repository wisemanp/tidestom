<!--<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-multiselect/0.9.15/js/bootstrap-multiselect.min.js"></script> -->
<div class="card">
    <div class="card-header">
       Run SNID
    </div>
    <div class="card-body">
			<form id="snid-form" class='ajax-form' data-result-id='snid-result' method="post" action="{% url 'snid-run' %}">
			{% csrf_token %}
			<!--Spectrum Inputs-->
			<input type="hidden" name="spectrum" value="{{ spectrum }}" class=form-control>
			<!-- Wavelength Inputs -->
			<div class="form-row">
			<div class="form-group col-md-6">
			<label for="wmin">Wavelength Min:</label>
			<input type="number" name="wmin" step="0.1" required value="4000" class="form-control">
			</div>
			<div class="form-group col-md-6">
			<label for="wmax">Wavelength Max:</label>
			<input type="number" name="wmax" step="1" required value="9000" class="form-control">
			</div>
			</div>
			
			<!-- Z Inputs -->
			<div class="form-row">
			<div class="form-group col-md-6">
			<label for="zmin">z Min:</label>
			<input type="number" name="zmin" step="0.001" required value="0.1" class="form-control">
			</div>
			<div class="form-group col-md-6">
			<label for="zmax">z Max:</label>
			<input type="number" name="zmax" step="0.001" required value="1.2" class="form-control">
			</div>
			</div>
			
			<!-- Emission Clip Inputs -->
			<div class="form-row">
			<div class="form-group col-md-6">
			<label for="emclip">Clip Emission at Redshift:</label>
			<input type="number" name="emclip" step="0.001" class="form-control">
			</div>
			<div class="form-group col-md-6">
			<label for="emwid">Clip Emission Width (&angst;):</label>
			<input type="number" name="emwid" step="1" required value="40" class="form-control">
			</div>
			</div>
			
			<!-- Age Inputs Inputs -->
			<div class="form-row">
			<div class="form-group col-md-6">
			<label for="agemin">Minimum Age:</label>
			<input type="number" name="agemin" step="1" value=-90 class="form-control">
			</div>
			<div class="form-group col-md-6">
			<label for="agemax">Maximum age:</label>
			<input type="number" name="agemax" step="1" value=1000 class="form-control">
			</div>
			</div>
			
			<div class="form-row">
			<div class='form-group col-md-6 text-center'>
			<label for="use" class="d-block"> Use these types:</label>
			<select id='use' name='use' multiple='multiple'>
				<option value='Ia'>Ia</option>
				<option value='Ib'>Ib</option>
				<option value='Ic'>Ic</option>
				<option value='II'>II</option>
				<option value='NotSN'>Not SN</option>
			</select>
			</div>
			
			<div class='form-group col-md-6 text-center'>
			<label for="usesub" class="d-block"> Use these subtypes:</label>
			<select id='usesub' name='usesub' multiple='multiple'>
				<option value='type1'>type1</option>
				<option value='type2'>type2</option>
				<option value='type3'>type3</option>
				<option value='type4'>type4</option>
				<option value='type5'>type5</option>
			</select>
			</div>
			</div>
						
			<div class="form-row">
			<div class='form-group col-md-6 text-center'>
			<label for="avoid" class="d-block"> Avoid these types:</label>
			<select id='avoid' name='avoid' multiple='multiple'>
				<option value='Ia'>Ia</option>
				<option value='Ib'>Ib</option>
				<option value='Ic'>Ic</option>
				<option value='II'>II</option>
				<option value='NotSN'>NotSN</option>
			</select>
			</div>
			
			<div class='form-group col-md-6 text-center'>
			<label for="avoidsub" class="d-block"> Avoid these subtypes:</label>
			<select id='avoidsub' name='avoidsub' multiple='multiple'>
				<option value='type1'>type1</option>
				<option value='type2'>type2</option>
				<option value='type3'>type3</option>
				<option value='type4'>type4</option>
				<option value='type5'>type5</option>
			</select>
			</div>
			</div>
			<div class="form-group mt-3">
  				<label for="aband" class="form-check-label">
    				Tellurics:
    				<input class="form-check-input ml-2" type="checkbox" value="" id="aband" name='aband'>
  				</label>
			</div>
			<div class="form-group mt-3">
				<button type="submit" class="btn btn-primary btn-block">Run SNID</button>
			</div>
			</div>
		</form>
		<div id="snid-result" class="mt-3"></div>

		<div id="previous-snid-runs" class="mt-4">
		<h3>Previous SNID Runs</h3>
		<p id="no-runs" style="display:none;">No previous runs found.</p>
		<table id="runs-table" class="table table-hover table-sm table-bordered">
		<thead>
			<tr>
			<th>Run</th>
			<th>Modified</th>
			<th>Size (KB)</th>
			<th>File</th>
			</tr>
		</thead>
		<tbody></tbody>
		</table>
		</div>
	</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
	function setupMutualExclusion(selectA, selectB) {
		$(`#${selectA}`).on('change', function () {
			const selected = $(this).val() || [];
			const other = $(`#${selectB}`);
			selected.forEach(val => {
				other.multiselect('deselect', val);
			});
		});

		$(`#${selectB}`).on('change', function () {
			const selected = $(this).val() || [];
			const other = $(`#${selectA}`);
			selected.forEach(val => {
				other.multiselect('deselect', val);
			});
		});
	}


    function populateSelects(fileUrl, selectIds) {
        fetch(fileUrl)
            .then(response => response.text())
            .then(data => {
                const options = data.split("\n").map(line => line.trim()).filter(Boolean);
                selectIds.forEach(id => {
                    const select = document.getElementById(id);
                    if (!select) return;

                    // Clear old options
                    select.innerHTML = "";

                    // Add new options
                    options.forEach(opt => {
                        const option = document.createElement("option");
                        option.value = opt;
                        option.textContent = opt;
                        select.appendChild(option);
                    });

                    // Refresh Bootstrap Multiselect
                    $(`#${id}`).multiselect('rebuild');
                });
            })
            .catch(err => console.error("Error loading " + fileUrl, err));
    }
	
    // Populate subtypes (usesub + avoidsub)
    populateSelects("/media/snid_template_options/subtypes.txt", ["usesub"]);
    populateSelects("/media/snid_template_options/subtypes.txt", ["avoidsub"]);

	setupMutualExclusion("usesub", "avoidsub");
	setupMutualExclusion("use", "avoid");

	const targetId = "{{ spectrum|default:'' }}";
	const runsTable = document.querySelector("#runs-table tbody");
	const noRunsMsg = document.getElementById("no-runs");

if (!targetId) {
    console.warn("No target ID found; skipping previous run fetch.");
} else {
    fetch(`/api/previous_snid_runs/?target_id=${targetId}`)
        .then(response => {
            if (!response.ok) throw new Error(`Request failed: ${response.status}`);
            return response.json();
        })
        .then(data => {
            const results = data.results || [];
            if (results.length === 0) {
                noRunsMsg.style.display = "block";
                return;
            }

            results.forEach(run => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${run.run}</td>
                    <td>${run.modified}</td>
                    <td>${run.size_kb}</td>
                    <td><a href="${run.path}" target="_blank">Download</a></td>
                `;
                runsTable.appendChild(row);
            });
        })
        .catch(err => {
            console.error("Error fetching previous SNID runs:", err);
            noRunsMsg.textContent = "Failed to load previous runs.";
            noRunsMsg.style.display = "block";
        });
}

});
</script>
