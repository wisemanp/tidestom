<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aladin Lite v3 Example</title>
  <script src="https://aladin.u-strasbg.fr/AladinLite/api/v3/latest/aladin.js"></script>
  <style>
    #aladin-lite-div { width: 350px; height: 350px; }
  </style>
</head>
<body>

<label for="aladin-lite-div" style="display:block; width:250px;">
  <h3>Survey View</h3>
</label>
<div id="aladin-lite-div"></div>

<div id="chart-form-div" style="width:300px;">
  <form id="chart-form">
    <div class="form-group mt-1 mb-1">
      <div class="input-group">
        <div class="input-group-prepend">
          <span class="input-group-text bg-transparent" style="font-family: inherit;">Field of view</span>
        </div>
        <input type="number" class="form-control" id="fov" min="0" value="1">
        <div class="input-group-append">
          <select id="fov-units-select" class="form-control">
            <option>arcsec</option>
            <option selected>arcmin</option>
            <option>deg</option>
          </select>
        </div>
      </div>
    </div>
    <div class="form-group mt-1 mb-1">
      <div class="input-group">
        <div class="input-group-prepend">
          <label class="input-group-text bg-transparent" for="scale-bar-units-select">Scale bar</label>
        </div>
        <input type="number" class="form-control" id="scale-bar-size" min="0" value="0.1">
        <div class="input-group-append">
          <select id="scale-bar-units-select" class="form-control">
            <option>arcsec</option>
            <option selected>arcmin</option>
            <option>deg</option>
          </select>
        </div>
      </div>
    </div>
    <div class="form-group mt-1 mb-1">
      <input class="btn btn-primary" type="button" onclick="updateFromForm({{ target.ra }}, {{ target.dec }})" value="Update">
      <a class="btn btn-primary" id="download-chart" href="" download="chart.png" onclick="downloadImage()">Save Image</a>
    </div>
  </form>
</div>

<script>
  // Wait for Aladin v3 initialization
  A.init.then(() => {

    // Initialize Aladin Lite v3 viewer
    const aladin = A.aladin('#aladin-lite-div', {
      survey: 'P/DSS2/color',
      target: "{{ target.ra }} {{ target.dec }}",
      fov: getFovAsDegreesFromForm(),
      showReticle: false,
      showZoomControl: true,
      showGotoControl: false,
      showProjectionControl: false,
    });

    // Create Legacy Survey DR10 as base layer
    const dr10 = aladin.createImageSurvey(
      'CDS/LS_DR10_COLOR',
      'DESI Legacy Survey DR10 (color)',
      'https://alasky.cds.unistra.fr/DESI-legacy-surveys/DR10/CDS_P_DESI-Legacy-Surveys_DR10_color/',
      'equatorial',
      12,
      { imgFormat: 'png' }
    );
    aladin.setBaseImageLayer(dr10);

    aladin.setFrame('ICRSd');

    // Helper functions
    function toDegrees(value, units) {
      if (units === 'arcmin') return value / 60;
      if (units === 'arcsec') return value / 3600;
      return value;
    }

    function getFovAsDegreesFromForm() {
      const fov = Number(document.getElementById('fov').value);
      const units = document.getElementById('fov-units-select').value;
      return fov >= 0 ? toDegrees(fov, units) : undefined;
    }

    function getScaleBarFromForm() {
      let size = Number(document.getElementById('scale-bar-size').value);
      if (size < 0) size = 0;
      const units = document.getElementById('scale-bar-units-select').value;
      const label = size + ' ' + units;
      return { size, units, label, sizeAsDegrees: toDegrees(size, units) };
    }

    // Custom Text overlay
    const Text = (function() {
      function Text(x, y, text, options) {
        options = options || {};
        this.x = x; this.y = y;
        this.text = text;
        this.color = options.color || '#f72525';
        this.align = options.align || 'center';
        this.baseline = options.baseline || 'alphabetic';
      }
      Text.prototype.setOverlay = function() {};
      Text.prototype.draw = function(ctx) {
        ctx.fillStyle = this.color;
        ctx.font = '15px Arial';
        ctx.textAlign = this.align;
        ctx.textBaseline = this.baseline;
        ctx.fillText(this.text, this.x, this.y);
      };
      return Text;
    })();

    // Draw compass and scale bar
    function annotateChart(targetRa, targetDec) {
      const fovDegrees = aladin.getFov()[0];
      const scaleBar = getScaleBarFromForm();
      const viewSizePix = aladin.getSize();
      const offsetPix = 30;

      const scaleStartPix = [offsetPix, viewSizePix[1] - offsetPix];
      const compassCenterPix = [viewSizePix[0] - offsetPix, viewSizePix[1] - offsetPix];

      const cosDec = Math.cos(targetDec * Math.PI / 180);
      const compassArm = fovDegrees / 10;

      const compassCenter = aladin.pix2world(compassCenterPix[0], compassCenterPix[1]);
      const compassNorth = [compassCenter[0], compassCenter[1] + compassArm];
      const compassEast = [compassCenter[0] + compassArm / cosDec, compassCenter[1]];

      const scaleStart = aladin.pix2world(scaleStartPix[0], scaleStartPix[1]);
      const scaleEnd = [scaleStart[0] - scaleBar.sizeAsDegrees / cosDec, scaleStart[1]];

      aladin.removeLayers();
      const layer = A.graphicOverlay({ name: 'chart annotations', color: '#f72525', lineWidth: 2 });
      aladin.addOverlay(layer);

      layer.add(A.polyline([compassNorth, compassCenter, compassEast]));
      layer.add(A.polyline([scaleStart, scaleEnd]));
      console.log("AAA", scaleStart, scaleEnd);
      layer.add(A.circle(targetRa, targetDec, 0.0002013888888888889));

      //const scaleLength = Math.abs(aladin.world2pix(scaleEnd[0], scaleEnd[1])[0] - scaleStartPix[0]);
      //layer.add(new Text(scaleStartPix[0] + scaleLength / 2, scaleStartPix[1] - 7, scaleBar.label));

      const compassNorthPix = aladin.world2pix(compassNorth[0], compassNorth[1]);
      const compassEastPix = aladin.world2pix(compassEast[0], compassEast[1]);
      layer.add(new Text(compassNorthPix[0], compassNorthPix[1] - 3, 'N'));
      layer.add(new Text(compassEastPix[0] - 3, compassEastPix[1], 'E', { align: 'end', baseline: 'middle' }));
    }

    // Event listeners
    aladin.on('positionChanged', () => annotateChart({{ target.ra }}, {{ target.dec }}));

    // Initial annotations
    annotateChart({{ target.ra }}, {{ target.dec }});

    // Update from form
    window.updateFromForm = function(ra, dec) {
      const fov = getFovAsDegreesFromForm();
      if (fov !== undefined) {
        aladin.setFov(fov);
        annotateChart(ra, dec);
      }
    };

    // Download image
    window.downloadImage = function() {
      document.getElementById('download-chart').href = aladin.getViewDataURL();
      return true;
    };

  }); // end A.init
</script>
</body>
</html>
