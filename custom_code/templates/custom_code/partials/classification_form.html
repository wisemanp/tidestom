<h4>Submit Classification</h4>
<form method="post" action="{% url 'submit_classification' target.id %}">
  {% csrf_token %}
  {{ form.tidesclass.label_tag }} {{ form.tidesclass }}
  <div id="tidesclass_other_field" style="display: none;">
    {{ form.tidesclass_other.label_tag }} {{ form.tidesclass_other }}
  </div>
  {{ form.tidesclass_subclass.label_tag }} {{ form.tidesclass_subclass }}

  <div class="mb-2">
    <label for="id_redshift_sn">Redshift (SN)</label>
    <input type="number" step="0.0001" min="-0.0001" id="id_redshift_sn" name="z_sn"
           value="{{ target.auto_tidesclass_z|default_if_none:0 }}">
  </div>

  <div class="mb-2">
    <label for="id_redshift_host">Redshift (Host)</label>
    <input type="number" step="0.0001" min="-0.0001" id="id_redshift_host" name="z_host"
           value="{{ target.auto_tidesclass_z|default_if_none:0 }}">
  </div>

  <div class="mb-2">
    <label for="id_phase">Phase (days)</label>
    <input type="number" step="0.1" id="id_phase" name="phase"
           value="{{ target.auto_tidesclass_phase|default_if_none:'' }}">
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const tidesclassField = document.getElementById('id_tidesclass');
    const tidesclassOtherField = document.getElementById('tidesclass_other_field');
    const tidesclassSubclassField = document.getElementById('id_tidesclass_subclass');

    function toggleTidesclassOtherField() {
      tidesclassOtherField.style.display = (tidesclassField.value === 'Other') ? 'block' : 'none';
    }

    function loadSubClassOptions() {
      const mainClass = tidesclassField.value || '';
      if (!mainClass) {
        tidesclassSubclassField.innerHTML = '<option value="">---------</option>';
        return;
      }
      const baseUrl = "{% url 'get_subclasses' %}"; // respects FORCE_SCRIPT_NAME (/marshal)
      const url = `${baseUrl}?main_class=${encodeURIComponent(mainClass)}`;

      fetch(url)
        .then(resp => { if (!resp.ok) throw new Error(`HTTP ${resp.status}`); return resp.json(); })
        .then(data => {
          tidesclassSubclassField.innerHTML = '<option value="">---------</option>';
          data.forEach(subclass => {
            const opt = document.createElement('option');
            opt.value = subclass.id ?? subclass.sub_class ?? '';
            opt.text = subclass.sub_class ?? subclass.text ?? String(subclass);
            tidesclassSubclassField.add(opt);
          });
        })
        .catch(err => console.error('Error loading sub-class options:', err));
    }

    tidesclassField.addEventListener('change', function() {
      toggleTidesclassOtherField();
      loadSubClassOptions();
    });
    toggleTidesclassOtherField();
    loadSubClassOptions();
  });
</script>
