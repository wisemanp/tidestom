name: Test & Deploy TOM Toolkit

on:
  push:
    branches:
      - hack-dev
      - main
  pull_request:
    branches:
      - hack-dev
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    #services:
    #  postgres:
    #    image: postgres:15
    #    ports: ['5432:5432']
    #    env:
    #      POSTGRES_USER: tides
    #      POSTGRES_DB: tides_db
    #      POSTGRES_HOST_AUTH_METHOD: trust  # allow passwordless connections
    #    options: >-
    #      --health-cmd="pg_isready -U tides -d tides_db"
    #      --health-interval=10s
    #      --health-timeout=5s
    #      --health-retries=10
    env:
      LASAIR_API_KEY: ${{ secrets.LASAIR_API_KEY }}
      TIDES_TEST_DIR: "dummy_dir"
    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Cache Docker Layers
      - name: Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 4. Build Images
      - name: Build Services
        run: docker compose build

      # 5. Start Containers
      - name: Start Services
        run: docker compose -f docker-compose.yml -f docker-compose-override.yml up web snid_api ngsf_api

      # 6. Wait for Postgres
      #- name: Wait for Postgres
      #  run: |
      #    for i in {1..30}; do
      #      if pg_isready -h localhost -p 5432 -U tides -d tides_db; then exit 0; fi
      #      sleep 2
      #    done
      #    echo "Postgres not ready" && exit 1
      #- name: Clean migration caches
      #  run: |
      #    find . -path "*/migrations/__pycache__/*" -delete
          
      # 7. Run tests
      - name: Run test suite
        run: docker compose -f docker-compose.yml -f docker-compose-override.yml run --rm web python manage.py test

      # 8. Deploy TOM Toolkit server (Django runserver)
      - name: Check server deployment
        run: docker compose -f docker-compose.yml -f docker-compose-override.yml run --rm web python manage.py check

      # 9 . Shut down containers
      - name: Shut down containers
        run: docker compose down -v

