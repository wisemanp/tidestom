version: "3.9"

services:
  init-gatekeeper:
    image: alpine:3.19
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_started
    command: >
      sh -c "
        echo 'Checking and creating API workspace directories' &&
        #for dir in /snid_api_runs/workspaces; do
        #  mkdir -pv $dir &&
        #  chown -R 1000:1000 $dir &&
        #  chmod -R 770 $dir
        #done &&
        echo 'Checking other directories' &&
        mkdir -pv /ngsf_api_runs/workspaces &&
        mkdir -pv /spectra_volume/test_data/sims &&
        mkdir -pv /static/plots &&
        echo 'Copying test data if available' &&
        cp -ru /test_data_src/* /spectra_volume/test_data/sims/ 2>/dev/null || true &&
        cp -ru /test_data/mock_DB.csv /spectra_volume/test_data/ 2>/dev/null || true && 
        cp -ru /test_plots_src/* /static/plots/ 2>/dev/null || true &&
        echo 'Directories Ready' &&

        sleep 10 &&

        echo 'Preparing database init script' &&
        apk add --no-cache postgresql-client git &&

        if [ ! -f /db_init/.applied ]; then
          echo 'Cloning DB scripts'
          git clone https://github.com/TiDES-4MOST/tides-db-scripts.git /tmp/tides-db-scripts
          psql -h database -U tides -d tidestom -f /tmp/tides-db-scripts/tides_merged_schema.sql
          psql -h database -U tides -d tidestom -f /tmp/tides-db-scripts/tidestom_schema.sql
          psql -h database -U tides -d tidestom -c "ALTER TABLE pipeline_classification_global add z double precision;"
          psql -h database -U tides -d tidestom -c "ALTER TABLE pipeline_classification_global add zerr double precision;"
          psql -h database -U tides -d tidestom -c "ALTER TABLE pipeline_classification_global add phase double precision;"
          psql -h database -U tides -d tidestom -c "ALTER TABLE human_classifications add phase double precision;"
          psql -h database -U tides -d tidestom -c "ALTER TABLE human_classifications add host_z double precision;"
          touch /db_init/.applied 
          echo 'Database schema prepared'
        else
          echo 'Schema already present, skipping'
        fi
        echo 'Init complete'

        #echo 'Waiting for dependent APIs to become healthy...' &&
        #for url in $API_1_HEALTH $API_2_HEALTH; do
        #  attempt=1
        #  until wget -qO- --timeout=2 --tries=1 $url >/dev/null 2>&1; do
        #    if [ $attempt -ge 10 ]; then
        #      echo 'ERROR; $url did not become healthy.' >&2
        #      exit 1
        #    fi
        #    echo 'Attempt' $attempt 'failed for' $url '-retrying in 5s'
        #    attempt=$((attempt+1))
        #    sleep 5
        #  done
        #  echo '$url is healthy.'
        #done &&
        echo 'All dependencies healthy — init complete.'
      "

    environment:
      PGPASSWORD: example
    volumes:
      - snid_api_runs:/snid_api_runs
      - ngsf_api_runs:/ngsf_api_runs
      - media_volume:/media
      - spectra:/spectra_volume
      - static_volume:/static
      - ../test_data/:/test_data:ro #only for testing
      - ../test_data/sims:/test_data_src:ro #only for testing
      - ../test_data/plots:/test_plots_src:ro #only for testing
    healthcheck:
      test: ["CMD-SHELL", "[ -d /static/plots ] && [ -d /spectra_volume/test_data ]"]
      interval: 10s
      retries: 3
      start_period: 5s
    restart: "no"

  web:
    build: .
    entrypoint: []
    command: >
      sh -c "
        python manage.py populate_tidesclasses && \
        python manage.py add_targets && \
        python manage.py add_spectra_to_db --mock &&\
        exec gunicorn tidestom.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class gevent --log-level debug --capture-output --enable-stdio-inheritance
        "
    cpus: 2
    ports:
      - "8000:8000"
    depends_on:
      init-gatekeeper:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - snid_api_runs:/snid_api_runs
      - ngsf_api_runs:/ngsf_api_runs
      - spectra:/data/spectra:ro
    environment:
      TIDES_TEST_DIR: '/data/spectra/test_data/'
      DB_HOST: database
      DB_USER: tides
      DB_PASS: example
      DB_PORT: 5432
      DB_NAME: tidestom
      LOCAL_MODE: 'True'
      DJANGO_SECRET_KEY: "u-a)en=plsciz3d4(2*yc()4(1=#@o)bkdusqho3kx%)i&amp;0cy"
      DJANGO_SETTINGS_MODULE: tidestom.settings
      #SNID_API_URL: http://localhost:8000
      #NGSF_API_URL: http://localhost:8001

    #healthcheck:
    #  test: ["CMD-SHELL",
    #  "wget -qO- --timeout=2 --tries=1 http:192.168.10.117:8000/health >/dev/null 2>&1 && \
    #   wget -qO- --timeout=2 --tries=1 http:192.168.10.117:8001/health >/dev/null 2>&1"]
    #  interval: 30s
    #  timeout: 5s
    #  retries: 4
    #  start_period: 10s

  nginx:
    image: nginx:1.25
    cpus: 1
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
      - media_volume:/media
      - snid_api_runs:/snid_api_runs
      - ngsf_api_runs:/ngsf_api_runs
      - spectra:/spectra
    ports:
      - "8080:80"
    depends_on:
      - web
      - database

  database:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: tides
      POSTGRES_DB: tidestom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    entrypoint: []
    depends_on:
      database:
        condition: service_started
    command: >
      sh -c "
        until pg_isready -h database -U tides -d tidestom; do
          echo 'Waiting for DB...'
          sleep 2
        done && \
        python manage.py migrate && \
        python manage.py makemigrations && \
        python manage.py migrate
      "
    environment:
      TIDES_TEST_DIR: '/data/spectra/test_data/'
      DB_HOST: database
      DB_USER: tides
      DB_PASS: example
      PGPASSWORD: example
      DB_PORT: 5432
      DB_NAME: tidestom
      LOCAL_MODE: 'True'
      DJANGO_SECRET_KEY: "u-a)en=plsciz3d4(2*yc()4(1=#@o)bkdusqho3kx%)i&amp;0cy"
      DJANGO_SETTINGS_MODULE: tidestom.settings

volumes:
  static_volume:
  media_volume:
  snid_api_runs:
  spectra:
  pgdata:
  ngsf_api_runs:

